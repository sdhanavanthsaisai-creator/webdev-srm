<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

try {

const CC = window.CC || {};
const FALLBACK = [
  { id:'f1', n:'01', title:'Shipping the Golden Path', speaker:'Maya Okafor', role:'Core · API', location:'Forge Hall — Stage A', dur:'45 min', starts_at:new Date(Date.now()+2*864e5).toISOString() },
  { id:'f2', n:'02', title:'The Optimistic Interface', speaker:'Dev Ramanan', role:'Surface · Frontend', location:'Forge Hall — Stage A', dur:'40 min', starts_at:new Date(Date.now()+4*864e5).toISOString() },
  { id:'f3', n:'03', title:'Auth Without Tears', speaker:'Lena Vogt', role:'Core · Auth', location:'Workshop Bay 2', dur:'50 min', starts_at:new Date(Date.now()+6*864e5).toISOString() },
  { id:'f4', n:'04', title:'Designing at 375 Pixels', speaker:'Sofia Marchetti', role:'Surface · Design', location:'Workshop Bay 2', dur:'40 min', starts_at:new Date(Date.now()+9*864e5).toISOString() },
  { id:'f5', n:'05', title:'States Are the Product', speaker:'Jonas Feld', role:'Surface · Frontend', location:'Forge Hall — Stage B', dur:'45 min', starts_at:new Date(Date.now()+12*864e5).toISOString() },
  { id:'f6', n:'06', title:'Demo Day Rehearsal', speaker:'The ClubCraft Crew', role:'All lanes', location:'Main Floor', dur:'90 min', starts_at:new Date(Date.now()+15*864e5).toISOString() }
];
const WORKSHOPS = (CC.WORKSHOPS && CC.WORKSHOPS.length) ? CC.WORKSHOPS : FALLBACK;
const isReg = id => (CC.isReg ? CC.isReg(id) : false);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const N = Math.max(1, WORKSHOPS.length), STEP = Math.PI * 2 / N;
const R = 5.2, RAIL_Y = 4.55, PLATE_Y = 1.7, PLATE_H = 3.25;

/* renderer / scene / camera */
const canvas = document.getElementById('scene');
if (!canvas) throw new Error('no canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0D0B08);
scene.fog = new THREE.Fog(0x0D0B08, 18, 52);
const camera = new THREE.PerspectiveCamera(40, 1, .1, 90);

/* lights */
scene.add(new THREE.HemisphereLight(0x8a7a5e, 0x0b0906, .85));
const key = new THREE.DirectionalLight(0xffdfb0, 1.5); key.position.set(7, 11, 8); scene.add(key);
const rim = new THREE.DirectionalLight(0x6f7ea0, .45); rim.position.set(-8, 7, -7); scene.add(rim);
const core = new THREE.PointLight(0xff6a3d, 16, 24, 2); core.position.set(0, 2.6, 0); scene.add(core);

/* helpers */
const UP = new THREE.Vector3(0, 1, 0);
const _d = new THREE.Vector3(), _n = new THREE.Vector3(), _a = new THREE.Vector3(), _b = new THREE.Vector3();
const clamp01 = v => Math.max(0, Math.min(1, v));
function rodBetween(mesh, a, b){
  _d.subVectors(b, a);
  const len = Math.max(.0001, _d.length());
  mesh.position.copy(a).addScaledVector(_d, .5);
  mesh.scale.set(1, len, 1);
  mesh.quaternion.setFromUnitVectors(UP, _n.copy(_d).normalize());
}

/* materials — HDR colors pushed well past the bloom threshold */
const metalMat  = new THREE.MeshStandardMaterial({ color:0x55493A, roughness:.3,  metalness:.9 });
const darkMetal = new THREE.MeshStandardMaterial({ color:0x241E15, roughness:.5,  metalness:.6 });
const cableMat  = new THREE.MeshBasicMaterial({ color:0xB4A488, transparent:true, opacity:.9 });
const emberHDR    = new THREE.MeshBasicMaterial({ color:new THREE.Color(2.8,1.1,.5),  transparent:true, opacity:0, side:THREE.DoubleSide, depthWrite:false });
const accentHDR   = new THREE.MeshBasicMaterial({ color:new THREE.Color(1.6,.62,.3),  transparent:true, opacity:0, side:THREE.DoubleSide, depthWrite:false });
const railGlowMat = new THREE.MeshBasicMaterial({ color:new THREE.Color(3.0,1.2,.55), transparent:true, opacity:0 });

/* textures */
function radialGlowTex(){
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const c = cv.getContext('2d');
  const g = c.createRadialGradient(128,128,8,128,128,128);
  g.addColorStop(0,'rgba(255,150,80,.9)'); g.addColorStop(.45,'rgba(255,110,50,.28)'); g.addColorStop(1,'rgba(255,110,50,0)');
  c.fillStyle = g; c.fillRect(0,0,256,256);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function shadowTex(){
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const c = cv.getContext('2d');
  const g = c.createRadialGradient(64,64,6,64,64,64);
  g.addColorStop(0,'rgba(0,0,0,.95)'); g.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(cv);
}
function dashRingTex(){
  const S = 1024, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const c = cv.getContext('2d');
  c.translate(S/2, S/2);
  c.strokeStyle = 'rgba(207,196,176,.95)'; c.lineWidth = 7; c.setLineDash([30,24]);
  c.beginPath(); c.arc(0,0,S*.487,0,Math.PI*2); c.stroke();
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
/* the big one: a soft halo ring that makes the circle look lit from within */
function ringGlowTex(){
  const S = 1024, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const c = cv.getContext('2d');
  c.translate(S/2, S/2);
  const rp = S * (R / (2*(R + 1.9)));           /* maps to world radius R on the halo plane */
  c.strokeStyle = 'rgba(255,130,60,1)';
  c.shadowColor = 'rgba(255,110,50,1)';
  c.globalAlpha = .35; c.lineWidth = 90; c.shadowBlur = 70;
  c.beginPath(); c.arc(0,0,rp,0,Math.PI*2); c.stroke();
  c.globalAlpha = .6;  c.lineWidth = 34; c.shadowBlur = 34;
  c.beginPath(); c.arc(0,0,rp,0,Math.PI*2); c.stroke();
  c.globalAlpha = .95; c.lineWidth = 12; c.shadowBlur = 12;
  c.beginPath(); c.arc(0,0,rp,0,Math.PI*2); c.stroke();
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const glowTex = radialGlowTex(), shTex = shadowTex(), dashTex = dashRingTex(), haloTex = ringGlowTex();

/* floor & markings */
const floor = new THREE.Mesh(new THREE.CircleGeometry(36, 72),
  new THREE.MeshStandardMaterial({ color:0x161108, roughness:.92, metalness:.18 }));
floor.rotation.x = -Math.PI/2; scene.add(floor);

const grid = new THREE.PolarGridHelper(10, 12, 6, 72, 0x241C11, 0x1B150C);
grid.material.transparent = true; grid.material.opacity = .5;
grid.position.y = .012; scene.add(grid);

const pool = new THREE.Mesh(new THREE.PlaneGeometry(5.6, 5.6),
  new THREE.MeshBasicMaterial({ map:glowTex, transparent:true, opacity:.55, depthWrite:false, blending:THREE.AdditiveBlending }));
pool.rotation.x = -Math.PI/2; pool.position.y = .016; pool.renderOrder = 1; scene.add(pool);

/* halo — soft light bleeding around the whole circle */
const HALO_SIZE = 2*(R + 1.9);
const haloMat = new THREE.MeshBasicMaterial({ map:haloTex, transparent:true, opacity:0, depthWrite:false, blending:THREE.AdditiveBlending });
const halo = new THREE.Mesh(new THREE.PlaneGeometry(HALO_SIZE, HALO_SIZE), haloMat);
halo.rotation.x = -Math.PI/2; halo.position.y = .024; halo.renderOrder = 3; scene.add(halo);

function flatRing(rIn, rOut, mat, y, order){
  const m = new THREE.Mesh(new THREE.RingGeometry(rIn, rOut, 220), mat);
  m.rotation.x = -Math.PI/2; m.position.y = y; m.renderOrder = order; scene.add(m); return m;
}
/* bold ember band + two accent stripes — triple the old weight */
flatRing(R - .14, R + .14, emberHDR, .028, 4);
flatRing(R - .30, R - .265, accentHDR, .028, 5);
flatRing(R + .265, R + .30, accentHDR, .028, 5);

const DASH_R = R + .34, DASH_SIZE = DASH_R / .487;
const dash = new THREE.Mesh(new THREE.PlaneGeometry(DASH_SIZE, DASH_SIZE),
  new THREE.MeshBasicMaterial({ map:dashTex, transparent:true, opacity:.42, depthWrite:false }));
dash.rotation.x = -Math.PI/2; dash.position.y = .02; dash.renderOrder = 2;
const dashSpin = new THREE.Group(); dashSpin.add(dash); scene.add(dashSpin);

const tickE = new THREE.MeshBasicMaterial({ color:new THREE.Color(2.2,.75,.35), depthWrite:false });
const tickP = new THREE.MeshBasicMaterial({ color:0x5E5240, transparent:true, opacity:.7, depthWrite:false });
for (let k = 0; k < 60; k++){
  const major = k % Math.round(60/N) === 0;
  const a = k/60 * Math.PI * 2;
  const t = new THREE.Mesh(new THREE.PlaneGeometry(major ? .06 : .022, major ? .6 : .22), major ? tickE : tickP);
  t.rotation.x = -Math.PI/2; t.rotation.z = -a;
  const rr = R + 1.05;
  t.position.set(Math.sin(a)*rr, .03, Math.cos(a)*rr);
  t.renderOrder = 6; scene.add(t);
}

const numMeshes = [];
for (let i = 0; i < N; i++){
  const g = new THREE.Group(); g.rotation.y = i*STEP; scene.add(g);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(.85,.85),
    new THREE.MeshBasicMaterial({ transparent:true, opacity:.9, depthWrite:false }));
  m.rotation.x = -Math.PI/2; m.position.set(0, .032, R + 1.7); m.renderOrder = 7;
  g.add(m); numMeshes.push(m);
}
function drawNumbers(){
  numMeshes.forEach((m, i) => {
    const txt = WORKSHOPS[i].n || String(i+1).padStart(2,'0');
    const cv = document.createElement('canvas'); cv.width = cv.height = 128;
    const c = cv.getContext('2d');
    c.font = '600 58px "JetBrains Mono", monospace';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = '#FF7A4A'; c.fillText(txt, 64, 68);
    const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
    if (m.material.map) m.material.map.dispose();
    m.material.map = t; m.material.needsUpdate = true;
  });
}
drawNumbers();

/* centre hub + lamp */
const hub = new THREE.Mesh(new THREE.CylinderGeometry(.6,.7,.14,48), darkMetal);
hub.position.y = .07; scene.add(hub);
const hubRing = new THREE.Mesh(new THREE.RingGeometry(.32,.36,64), emberHDR);
hubRing.rotation.x = -Math.PI/2; hubRing.position.y = .145; scene.add(hubRing);
const pole = new THREE.Mesh(new THREE.CylinderGeometry(.035,.05,2.3,10), metalMat);
pole.position.y = 1.44; scene.add(pole);
const bulb = new THREE.Mesh(new THREE.SphereGeometry(.1,20,16),
  new THREE.MeshBasicMaterial({ color:new THREE.Color(2.3,1.05,.5) }));
bulb.position.y = 2.62; scene.add(bulb);

/* pylons */
function pylon(theta){
  const g = new THREE.Group(); g.rotation.y = theta; scene.add(g);
  const post = new THREE.Mesh(new THREE.CylinderGeometry(.05,.085,RAIL_Y,12), metalMat);
  post.position.set(0, RAIL_Y/2, R+.8); g.add(post);
  const foot = new THREE.Mesh(new THREE.CylinderGeometry(.26,.34,.14,12), darkMetal);
  foot.position.set(0,.07,R+.8); g.add(foot);
  const arm = new THREE.Mesh(new THREE.CylinderGeometry(.036,.036,.82,8), metalMat);
  arm.rotation.x = Math.PI/2; arm.position.set(0, RAIL_Y, R+.41); g.add(arm);
  const clamp = new THREE.Mesh(new THREE.BoxGeometry(.18,.13,.15), darkMetal);
  clamp.position.set(0, RAIL_Y, R+.04); g.add(clamp);
  const tip = new THREE.Mesh(new THREE.SphereGeometry(.06,12,10), railGlowMat);
  tip.position.set(0, RAIL_Y+.1, R+.8); g.add(tip);
  const brace = new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,1,6), cableMat);
  g.add(brace);
  rodBetween(brace, _a.set(0, RAIL_Y-.06, R+.05), _b.set(0, RAIL_Y-1.2, R+.78));
}
pylon(Math.PI/6);
pylon(Math.PI/6 + Math.PI*2/3);
pylon(Math.PI/6 + Math.PI*4/3);

/* rail: heavier metal torus + fat glowing guide line */
const rail = new THREE.Mesh(new THREE.TorusGeometry(R,.095,20,220), metalMat);
rail.rotation.x = Math.PI/2; rail.position.y = RAIL_Y; scene.add(rail);
const railGlow = new THREE.Mesh(new THREE.TorusGeometry(R,.05,10,220), railGlowMat);
railGlow.rotation.x = Math.PI/2; railGlow.position.y = RAIL_Y; scene.add(railGlow);

/* panel textures */
function wrapText(c, text, maxW){
  const out = []; let line = '';
  for (const word of text.split(' ')){
    const t = line ? line + ' ' + word : word;
    if (c.measureText(t).width > maxW && line){ out.push(line); line = word; } else line = t;
  }
  if (line) out.push(line);
  return out;
}
function seg(c, x1,y1,x2,y2){ c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); }

function drawPanel(i, reg){
  const w = WORKSHOPS[i];
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 672;
  const c = cv.getContext('2d');
  c.fillStyle = '#151109'; c.fillRect(0,0,512,672);
  c.fillStyle = 'rgba(240,233,220,0.03)';
  for (let k=0;k<70;k++) c.fillRect(Math.random()*512, Math.random()*672, 1.4, 1.4);
  c.strokeStyle = 'rgba(240,233,220,0.16)'; c.lineWidth = 1.5;
  c.strokeRect(16.5, 16.5, 479, 639);
  c.strokeStyle = 'rgba(255,106,61,0.9)'; c.lineWidth = 2;
  [[16,16,1,1],[495,16,-1,1],[16,655,1,-1],[495,655,-1,-1]].forEach(([x,y,dx,dy]) => {
    c.beginPath(); c.moveTo(x+dx*18, y); c.lineTo(x, y); c.lineTo(x, y+dy*18); c.stroke();
  });
  c.font = '500 21px "JetBrains Mono", monospace'; c.fillStyle = '#A2957F'; c.textAlign = 'left';
  c.fillText('WS·' + w.n, 38, 60);
  const sd = new Date(w.starts_at).toLocaleDateString(undefined,{month:'short',day:'2-digit'}).toUpperCase();
  c.textAlign = 'right'; c.fillText(sd, 474, 60); c.textAlign = 'left';
  c.strokeStyle = 'rgba(240,233,220,0.14)'; c.lineWidth = 1; seg(c, 38,84, 474,84);

  c.font = '600 42px Fraunces, Georgia, serif'; c.fillStyle = '#F0EADC';
  let y = 146;
  wrapText(c, w.title, 436).slice(0,4).forEach(l => { c.fillText(l, 38, y); y += 50; });

  y += 18;
  c.font = '500 21px "JetBrains Mono", monospace'; c.fillStyle = '#EFE7D8';
  c.fillText(w.speaker.toUpperCase(), 38, y);
  y += 30;
  c.font = '400 18px "JetBrains Mono", monospace'; c.fillStyle = '#A2957F';
  c.fillText(w.role.toUpperCase(), 38, y);

  seg(c, 38,548, 474,548);
  c.save(); c.translate(46,584); c.rotate(Math.PI/4); c.fillStyle = '#FF6A3D'; c.fillRect(-4,-4,8,8); c.restore();
  c.font = '400 19px "JetBrains Mono", monospace'; c.fillStyle = '#CFC4B0';
  c.fillText(w.location.toUpperCase(), 66, 591);
  const tm = new Date(w.starts_at).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  c.fillStyle = '#A2957F'; c.fillText(tm.toUpperCase() + ' · ' + w.dur.toUpperCase(), 66, 618);
  seg(c, 38,634, 474,634);

  if (reg){
    c.fillStyle = '#FF6A3D'; c.beginPath(); c.arc(46, 649, 5, 0, Math.PI*2); c.fill();
    c.font = '500 19px "JetBrains Mono", monospace'; c.fillText('SEAT CLAIMED', 66, 656);
  } else {
    c.fillStyle = '#8F8471'; c.font = '400 19px "JetBrains Mono", monospace';
    c.fillText('TAP TO OPEN', 38, 656);
    c.strokeStyle = '#8F8471'; c.lineWidth = 2;
    seg(c, 448, 649, 468, 649);
    seg(c, 460, 642, 468, 649);
    seg(c, 460, 656, 468, 649);
  }
  return cv;
}

/* plates on trolleys, each with a glowing station point on the rail */
const ring = new THREE.Group(); scene.add(ring);
const faces = [];
const hookGeo = new THREE.TorusGeometry(.11,.03,10,24);
const lugGeo  = new THREE.BoxGeometry(.05,.09,.05);
const cabGeo  = new THREE.CylinderGeometry(.018,.018,1,6);

const panels = WORKSHOPS.map((w, i) => {
  const th = i * STEP;
  const g = new THREE.Group();
  g.position.set(R*Math.sin(th), 0, R*Math.cos(th));
  g.rotation.y = th;

  const backing = new THREE.Mesh(new THREE.BoxGeometry(2.5, PLATE_H, .05),
    new THREE.MeshStandardMaterial({ color:0x1E1811, roughness:.35, metalness:.5 }));
  const faceMat = new THREE.MeshBasicMaterial({ color:0xffffff });
  const face = new THREE.Mesh(new THREE.PlaneGeometry(2.35, 3.05), faceMat);
  face.position.z = .031; face.userData.i = i;
  const overlay = new THREE.Mesh(new THREE.PlaneGeometry(2.35, 3.05),
    new THREE.MeshBasicMaterial({ color:0xFF6A3D, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false }));
  overlay.position.z = .038;

  const body = new THREE.Group();
  body.position.y = PLATE_Y;
  body.add(backing, face, overlay);

  const hangMat = cableMat.clone();
  hangMat.opacity = reduced ? .9 : 0;
  const hook = new THREE.Mesh(hookGeo, hangMat);
  hook.rotation.y = Math.PI/2; hook.position.set(0, RAIL_Y, 0);
  const lugL = new THREE.Mesh(lugGeo, hangMat); lugL.position.set(-.12, RAIL_Y-.08, 0);
  const lugR = new THREE.Mesh(lugGeo, hangMat); lugR.position.set( .12, RAIL_Y-.08, 0);
  const cabL = new THREE.Mesh(cabGeo, hangMat);
  const cabR = new THREE.Mesh(cabGeo, hangMat);

  /* glowing station point marking this seat on the ring */
  const stMat = new THREE.SpriteMaterial({ map:glowTex, color:new THREE.Color(2.6,1.05,.5),
    transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false });
  const station = new THREE.Sprite(stMat);
  station.scale.set(1.25,1.25,1); station.position.set(0, RAIL_Y, 0);

  const shadow = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 2.8),
    new THREE.MeshBasicMaterial({ map:shTex, transparent:true, opacity:0, depthWrite:false }));
  shadow.rotation.x = -Math.PI/2; shadow.position.y = .022; shadow.renderOrder = 3;

  g.add(body, hook, lugL, lugR, cabL, cabR, station, shadow);
  ring.add(g);
  faces.push(face);

  const rest = new THREE.Vector3(0, PLATE_Y, 0);
  const scatter = new THREE.Vector3((Math.random()-.5)*24, 1.5 + Math.random()*6, -9 - Math.random()*10);
  const scOff = scatter.clone().sub(new THREE.Vector3(g.position.x, 0, g.position.z));

  return { g, body, face, faceMat, overlay, cabL, cabR, shadow, hangMat, stMat,
           rest, scOff, th, phase: i*1.13, sry: (Math.random()-.5)*4,
           lift:0, dim:1, glow:0, sc:1, bob:0,
           t0: performance.now() + 500 + i*110, done: reduced };
});

function applyTex(i){
  const p = panels[i];
  const tex = new THREE.CanvasTexture(drawPanel(i, isReg(WORKSHOPS[i].id)));
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  if (p.faceMat.map) p.faceMat.map.dispose();
  p.faceMat.map = tex; p.faceMat.needsUpdate = true;
}
panels.forEach((_, i) => applyTex(i));
Promise.all([
  document.fonts.load('600 42px Fraunces'),
  document.fonts.load('500 21px "JetBrains Mono"')
]).catch(() => {}).then(() => { panels.forEach((_, i) => applyTex(i)); drawNumbers(); });
window.addEventListener('cc:seats', e => { if (panels[e.detail.index]) applyTex(e.detail.index); });

/* embers */
const EN = 240;
const ePos = new Float32Array(EN*3), eSeed = new Float32Array(EN), eSize = new Float32Array(EN);
for (let k=0;k<EN;k++){
  const a = Math.random()*Math.PI*2, r = 2 + Math.random()*9;
  ePos[k*3] = Math.cos(a)*r; ePos[k*3+1] = Math.random()*10; ePos[k*3+2] = Math.sin(a)*r;
  eSeed[k] = Math.random(); eSize[k] = 9 + Math.random()*16;
}
const eGeo = new THREE.BufferGeometry();
eGeo.setAttribute('position', new THREE.BufferAttribute(ePos, 3));
eGeo.setAttribute('aSeed', new THREE.BufferAttribute(eSeed, 1));
eGeo.setAttribute('aSize', new THREE.BufferAttribute(eSize, 1));
const eMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{ uTime:{value:0}, uPR:{value:1} },
  vertexShader:`
    attribute float aSeed; attribute float aSize;
    uniform float uTime, uPR; varying float vSeed;
    void main(){
      vSeed = aSeed;
      vec3 p = position;
      p.y = -2.0 + mod(p.y + uTime*(0.25 + aSeed*0.55), 10.0);
      p.x += sin(uTime*0.4 + aSeed*40.0)*0.35;
      p.z += cos(uTime*0.33 + aSeed*70.0)*0.35;
      vec4 mv = modelViewMatrix*vec4(p,1.0);
      gl_PointSize = aSize*uPR*(140.0/-mv.z);
      gl_Position = projectionMatrix*mv;
    }`,
  fragmentShader:`
    uniform float uTime; varying float vSeed;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      float a = smoothstep(0.5, 0.08, d);
      float fl = 0.5 + 0.5*sin(uTime*(1.5 + vSeed*3.0) + vSeed*50.0);
      vec3 col = mix(vec3(2.1,0.85,0.45), vec3(1.2,0.55,0.30), fract(vSeed*7.0));
      gl_FragColor = vec4(col*(0.5 + 0.9*fl), a*(0.22 + 0.5*fl));
      if (gl_FragColor.a < 0.01) discard;
    }`
});
const embers = new THREE.Points(eGeo, eMat);
embers.frustumCulled = false; scene.add(embers);

/* orbiting light packets — comets that ride the rail, lead one carries a real light */
const PK_N = 3, packets = [];
for (let k = 0; k < PK_N; k++){
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map:glowTex, color:new THREE.Color(3.2,1.3,.6), transparent:true, opacity:0,
    blending:THREE.AdditiveBlending, depthWrite:false }));
  s.scale.set(1.6,1.6,1);
  scene.add(s); packets.push(s);
}
const pkLight = new THREE.PointLight(0xff8a50, 0, 10, 2); scene.add(pkLight);

/* post — bloom tuned so every HDR element actually halos */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .9, .55, .7);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* scroll choreography — closer framing, ring fills the frame */
let baseZ = 14.6, ox = -0.9, anchors = [];
const keys = () => [
  { sel:'#hero',      c:[0, 3.00, baseZ + .6], l:[ox,      1.55, 0] },
  { sel:'#floor',     c:[0, 3.20, baseZ],      l:[ox + .35, 1.35, 0] },
  { sel:'#interlude', c:[0, 2.60, baseZ - 3.2],l:[0,        1.50, 0] },
  { sel:'#method',    c:[0, 2.50, baseZ - .6], l:[ox + .25, 1.40, 0] },
  { sel:'#blueprint', c:[0, 2.90, baseZ + .4], l:[ox + .15, 1.35, 0] },
  { sel:'#enter',     c:[0, 2.35, baseZ],      l:[ox + .55, 1.60, 0] }
];
function computeAnchors(){
  anchors = keys().map(k => {
    const el = document.querySelector(k.sel);
    return { top: el ? el.offsetTop : 0, c:k.c, l:k.l };
  });
}
const lerpA = (a,b,t) => [ a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t ];
const camPos = new THREE.Vector3(0, 3.0, 15.2), lookCur = new THREE.Vector3(-.9, 1.55, 0);

/* interaction — same contract as before */
let rot = -.4, targetRot = -.4, vel = 0, dragging = false, moved = 0, px = 0;
let hoverI = null, uiHover = null, selected = -1, overStage = false, lastLab = null;
const stage = document.getElementById('stage');
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();

function raycast(e){
  ndc.set((e.clientX/innerWidth)*2 - 1, -(e.clientY/innerHeight)*2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(faces, false)[0];
  hoverI = hit ? hit.object.userData.i : null;
}
function setLab(){
  const lab = hoverI !== null ? 'OPEN' : (overStage && !dragging ? 'DRAG' : '');
  if (lab !== lastLab){ lastLab = lab; window.dispatchEvent(new CustomEvent('cc:cursor', { detail:lab })); }
}
stage.addEventListener('pointerenter', () => overStage = true);
stage.addEventListener('pointerleave', () => { overStage = false; hoverI = null; setLab(); });
stage.addEventListener('pointerdown', e => {
  if (selected >= 0) return;
  dragging = true; moved = 0; px = e.clientX; vel = 0;
  try { stage.setPointerCapture(e.pointerId); } catch(err){}
});
stage.addEventListener('pointermove', e => {
  if (dragging){
    const dx = e.clientX - px; px = e.clientX; moved += Math.abs(dx);
    targetRot += dx*.0048; vel = dx*.0048;
  } else { raycast(e); setLab(); }
});
stage.addEventListener('pointerup', e => {
  if (!dragging) return;
  dragging = false;
  if (moved < 8){ raycast(e); if (hoverI !== null) window.dispatchEvent(new CustomEvent('cc:open', { detail:{ i:hoverI } })); }
});
stage.addEventListener('pointercancel', () => dragging = false);

let lastY = scrollY;
addEventListener('scroll', () => { targetRot += (scrollY - lastY)*.00028; lastY = scrollY; }, { passive:true });
window.addEventListener('cc:hover',  e => uiHover = e.detail);
window.addEventListener('cc:detail', e => {
  selected = e.detail.i;
  if (selected >= 0){
    const want = -selected*STEP;
    let d = (want - rot) % (Math.PI*2);
    if (d >  Math.PI) d -= Math.PI*2;
    if (d < -Math.PI) d += Math.PI*2;
    targetRot = rot + d;
  }
});

let mnx = 0, mny = 0, parX = 0, parY = 0;
addEventListener('mousemove', e => {
  mnx = (e.clientX/innerWidth - .5)*2; mny = (e.clientY/innerHeight - .5)*2;
});

/* resize */
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); composer.setSize(w, h);
  camera.aspect = w/h; camera.updateProjectionMatrix();
  const mob = w < 760;
  ox = mob ? 0 : -0.9;
  baseZ = mob ? 18 : 14.6;
  eMat.uniforms.uPR.value = renderer.getPixelRatio();
  computeAnchors();
}
addEventListener('resize', resize);
resize();
camPos.set(...anchors[0].c); lookCur.set(...anchors[0].l);
setTimeout(resize, 400);
(document.fonts && document.fonts.ready || Promise.resolve()).then(() => setTimeout(resize, 100));

/* frame loop */
const START = performance.now();
let structIn = reduced ? 1 : 0;
let last = performance.now();
function tick(now){
  requestAnimationFrame(tick);
  const dt = Math.min(50, now - last); last = now;
  const t = now/1000, dn = Math.min(2.2, dt/16.66);
  let introDone = true;

  /* the ring lights itself in — fast and to full strength */
  if (structIn < 1){
    structIn = clamp01((now - START - 200)/1100);
    emberHDR.opacity   = .95 * structIn;
    accentHDR.opacity  = .6  * structIn;
    railGlowMat.opacity = structIn;
    haloMat.opacity    = .85 * structIn;
    pkLight.intensity  = 26  * structIn;
  }

  panels.forEach((p, i) => {
    if (!p.done){
      const e = 1 - Math.pow(1 - clamp01((now - p.t0)/1150), 3);
      if (e < 1) introDone = false;
      p.body.position.lerpVectors(p.scOff, p.rest, e);
      p.body.rotation.y = p.sry*(1 - e);
      const vis = clamp01((e - .55)/.45);
      p.hangMat.opacity = .9*vis;
      p.shadow.material.opacity = .34*vis;
      if (e >= 1){ p.done = true; p.body.position.copy(p.rest); }
    } else {
      p.bob = reduced ? 0 : Math.sin(t*.7 + p.phase)*.075;
      p.body.position.set(0, p.rest.y + p.bob + p.lift, 0);
      p.body.rotation.y = reduced ? 0 : Math.sin(t*.5 + p.phase)*.02;
    }

    /* station point pulses on the rail above each plate */
    p.stMat.opacity = (0.5 + 0.28*Math.sin(t*2.1 + p.phase)) * structIn;

    /* V-cables follow bob & lift */
    const topY = RAIL_Y - .12, by = p.body.position.y + PLATE_H/2 - .05;
    rodBetween(p.cabL, _a.set(-.12, topY, 0), _b.set(-.78, by, 0));
    rodBetween(p.cabR, _a.set( .12, topY, 0), _b.set( .78, by, 0));

    if (p.done) p.shadow.material.opacity = .34 * p.dim * Math.max(.4, 1 - p.bob*1.6);

    const tgtLift = (i === uiHover || i === hoverI) ? .3 : (i === selected ? .14 : 0);
    p.lift += (tgtLift - p.lift)*.12*dn;
    const tgtDim = (selected >= 0 && selected !== i) ? .45 : 1;
    p.dim += (tgtDim - p.dim)*.1*dn;
    p.faceMat.color.setScalar(p.dim);
    const tgtGlow = i === selected ? .12 : ((i === uiHover || i === hoverI) ? .09 : 0);
    p.glow += (tgtGlow - p.glow)*.14*dn;
    p.overlay.material.opacity = p.glow;
    const tgtSc = i === selected ? 1.06 : 1;
    p.sc += (tgtSc - p.sc)*.12*dn;
    p.body.scale.setScalar(p.sc);
  });

  /* comets circling the rail */
  for (let k = 0; k < PK_N; k++){
    const a = t*0.30 + k*(Math.PI*2/PK_N);
    packets[k].position.set(Math.sin(a)*R, RAIL_Y - .05, Math.cos(a)*R);
    packets[k].material.opacity = (0.55 + 0.4*(0.5 + 0.5*Math.sin(t*6 + k*2.1))) * structIn;
  }
  pkLight.position.copy(packets[0].position); pkLight.position.y += .3;

  if (!dragging){
    vel *= .94;
    if (Math.abs(vel) > .0004 && selected < 0) targetRot += vel*dn;
    const idle = selected < 0 && hoverI === null && uiHover === null && !dragging;
    if (idle && !reduced && introDone) targetRot += .0012*dn;
  }
  rot += (targetRot - rot)*.08*dn;
  ring.rotation.y = rot;
  dashSpin.rotation.y = t*.05;
  eMat.uniforms.uTime.value = t;

  let y = scrollY, a = anchors[0], b = anchors[0], tt = 0;
  for (let i = 0; i < anchors.length - 1; i++){
    if (y >= anchors[i].top){ a = anchors[i]; b = anchors[i+1]; tt = (y - a.top)/Math.max(1, b.top - a.top); }
  }
  tt = clamp01(tt); tt = tt*tt*(3 - 2*tt);
  const tp = lerpA(a.c, b.c, tt), tl = lerpA(a.l, b.l, tt);
  camPos.lerp(new THREE.Vector3(...tp), .07*dn);
  lookCur.lerp(new THREE.Vector3(...tl), .07*dn);
  if (!reduced){ parX += (mnx - parX)*.05*dn; parY += (mny - parY)*.05*dn; }
  camera.position.set(camPos.x + parX*.7, camPos.y - parY*.45, camPos.z);
  camera.lookAt(lookCur);

  composer.render();
}
requestAnimationFrame(tick);

} catch(err){
  document.body.classList.add('no3d');
}
</script>
